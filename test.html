<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBTI 测试答题</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 门禁检查
        if (sessionStorage.getItem('mbti_verified') !== 'true') {
            window.location.replace('index.html');
        }
    </script>
</head>
<body>
    <div class="container">
        <h1 id="test-title">MBTI 测试问卷</h1>
        <div class="progress" id="progress-display">
            已完成 <strong>0</strong> / 40 题
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" style="width:0%;"></div>
            </div>
        </div>

        <form id="mbti-form">
            <div id="question-area">
                <!-- 题目内容由 JS 渲染 -->
            </div>

            <div class="navigation-buttons">
                <button type="button" id="prev-button" class="button" style="display: none;">上一题</button>
                <button type="button" id="next-button" class="button">下一题</button>
                <button type="submit" id="submit-button" class="button submit-button" style="display: none;">查看结果</button>
            </div>
        </form>
    </div>

    <script src="data.js?v=4"></script>
    <script src="script.js?v=4"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBTI 测试结果</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 门禁检查
        if (sessionStorage.getItem('mbti_verified') !== 'true') {
            window.location.replace('index.html');
        }
    </script>
</head>
<body>
    <div class="container result-container">
        <h1>你的 MBTI 测试结果</h1>

        <div id="result-content">
            <!-- 由 JS 动态渲染 -->
            <p style="text-align:center; color:#888; padding:40px;">正在计算你的性格类型...</p>
        </div>

        <!-- 分享卡片（截图目标区域，屏幕外渲染） -->
        <div id="share-card" class="share-card">
            <div class="share-card-inner">
                <div class="share-deco-top"></div>
                <div class="share-deco-bottom"></div>
                <div class="share-header">
                    <div class="share-badge" id="share-badge">--</div>
                    <div class="share-name" id="share-name">--</div>
                </div>
                <div class="share-dims" id="share-dims"></div>
                <div class="share-tagline" id="share-tagline"></div>
                <div class="share-watermark">MBTI 性格测试</div>
            </div>
        </div>

        <div class="result-actions">
            <button id="btn-save-img" class="button btn-save" onclick="saveAsImage()">📸 保存为图片</button>
            <a href="test.html" class="button btn-secondary">🔄 重新测试</a>
            <a href="index.html" class="button btn-orange">🏠 返回首页</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="data.js"></script>
    <script src="result.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBTI 测试结果</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 门禁检查
        if (sessionStorage.getItem('mbti_verified') !== 'true') {
            window.location.replace('index.html');
        }
    </script>
</head>
<body>
    <div class="container result-container">
        <h1>你的 MBTI 测试结果</h1>

        <div id="result-content">
            <!-- 由 JS 动态渲染 -->
            <p style="text-align:center; color:#888; padding:40px;">正在计算你的性格类型...</p>
        </div>

        <div class="result-actions">
            <a href="test.html" class="button btn-secondary">🔄 重新测试</a>
            <a href="index.html" class="button btn-orange">🏠 返回首页</a>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="result.js"></script>
</body>
</html>
